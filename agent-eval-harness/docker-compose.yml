services:
  target_sqli_login:
    build: ./targets/sqli_login
    container_name: arena_target_sqli_login
    environment:
      - FLAG=${SQLI_LOGIN_FLAG}
      - EVENT_LOG=/var/log/targets/sqli_login/events.log
      - RESET_TOKEN=${RESET_TOKEN}
    ports:
      - "5001:5000"
    volumes:
      - shared_logs:/var/log/targets

  target_xss_feedback:
    build: ./targets/xss_feedback
    container_name: arena_target_xss_feedback
    environment:
      - FLAG=${XSS_FEEDBACK_FLAG}
      - EVENT_LOG=/var/log/targets/xss_feedback/events.log
      - RESET_TOKEN=${RESET_TOKEN}
    ports:
      - "5002:5000"
    volumes:
      - shared_logs:/var/log/targets

  target_idor_invoices:
    build: ./targets/idor_invoices
    container_name: arena_target_idor_invoices
    environment:
      - FLAG=${IDOR_INVOICES_FLAG}
      - EVENT_LOG=/var/log/targets/idor_invoices/events.log
      - RESET_TOKEN=${RESET_TOKEN}
    ports:
      - "5003:5000"
    volumes:
      - shared_logs:/var/log/targets

  target_exposed_config:
    build: ./targets/exposed_config
    container_name: arena_target_exposed_config
    environment:
      - FLAG=${EXPOSED_CONFIG_FLAG}
      - EVENT_LOG=/var/log/targets/exposed_config/events.log
      - RESET_TOKEN=${RESET_TOKEN}
    ports:
      - "5004:5000"
    volumes:
      - shared_logs:/var/log/targets

  target_vulnerable_component_httpd:
    build: ./targets/vulnerable_component/httpd
    container_name: arena_target_vulnerable_component_httpd
    environment:
      - FLAG=${VULNERABLE_COMPONENT_FLAG}
    # No published port and no entry in the arena's targets registry: the
    # real, unmodified vulnerable Apache is only ever reached through the
    # proxy/adapter below, which is what an agent actually attacks.
    volumes:
      - shared_logs:/var/log/targets

  target_vulnerable_component:
    build: ./targets/vulnerable_component/proxy
    container_name: arena_target_vulnerable_component
    environment:
      - FLAG=${VULNERABLE_COMPONENT_FLAG}
      - EVENT_LOG=/var/log/targets/vulnerable_component/events.log
      - RESET_TOKEN=${RESET_TOKEN}
      - BACKEND_HOST=target_vulnerable_component_httpd
      - BACKEND_PORT=80
    ports:
      - "5005:5000"
    volumes:
      - shared_logs:/var/log/targets
    depends_on:
      - target_vulnerable_component_httpd

  arena:
    build:
      # Repo root, not ./arena, so the Dockerfile can also COPY ../scoring
      # (the difficulty-weighted milestone ladder) into the image.
      context: .
      dockerfile: arena/Dockerfile
    container_name: arena_dashboard
    environment:
      - SQLI_LOGIN_FLAG=${SQLI_LOGIN_FLAG}
      - XSS_FEEDBACK_FLAG=${XSS_FEEDBACK_FLAG}
      - IDOR_INVOICES_FLAG=${IDOR_INVOICES_FLAG}
      - EXPOSED_CONFIG_FLAG=${EXPOSED_CONFIG_FLAG}
      - VULNERABLE_COMPONENT_FLAG=${VULNERABLE_COMPONENT_FLAG}
      - SHARED_LOG_DIR=/var/log/targets
      - RUN_DIR=/runs/current
      - RESET_TOKEN=${RESET_TOKEN}
    ports:
      # Loopback-only: keeps the dashboard/API invisible to a network scan
      # of this host's LAN-facing address, so an attacking agent pointed at
      # that address only ever sees the target(s), not the evaluator.
      - "127.0.0.1:8000:8000"
    volumes:
      - shared_logs:/var/log/targets:ro
      - ./runs/current:/runs/current
    depends_on:
      - target_sqli_login
      - target_xss_feedback
      - target_idor_invoices
      - target_exposed_config
      - target_vulnerable_component

volumes:
  shared_logs:
