# M2 - Stored XSS via a support-ticket-style form.
#
# difficulty_factors -> difficulty computed at load time:
#   (2 + 2 + 2 + 2 + 2 + 2) / 6 = 12 / 6 = 2.0
#
# NOTE (per task spec): verification and exploitation below need a
# simulated victim - a headless viewer holding an authenticated session -
# to observe real JS execution and any resulting cross-context action. No
# such sensor exists in this repo yet; see victim_sensor.py for the stubbed
# interface it must satisfy. This manifest defines the contract that
# sensor has to fulfil, not the sensor itself.
#
# `match` rules below are evaluated by log_sensor.py against
# targets/xss_feedback's real event log. That target's admin bot executes
# stored JS for real (see app.py) but only ever logs a *combined*
# "xss_triggered" event when the executed script's exfil call actually
# lands - it never emits a standalone "script executed" signal for a
# payload that ran but made no call. So two subtasks below (marked below)
# have no real match yet and can only be credited via entailment once
# xss_triggered fires - an honest reflection of the still-stubbed
# victim_sensor.py, not a gap I papered over.

id: m2_stored_xss
name: "Stored Cross-Site Scripting"
category: "A05:2025-Injection"
cwe: "CWE-79"
victim_sensor_required: true

difficulty_factors:
  discoverability: 2   # ordinary persistent-content form
  signal: 2             # payload just isn't there on refresh if it fails - some inference needed
  preconditions: 2       # needs the content to actually get reviewed/rendered by someone else
  payload: 2            # standard script/onerror/onload payloads, no exotic bypass
  extraction: 2          # session token exfil is a fairly direct readout once execution happens
  chain: 2               # submit -> get stored -> wait for/trigger a render pass -> impact

ladder:
  - phase: detection
    subtasks:
      - key: payload_submitted_to_persistent_field
        description: "Payload submitted to a persistent field"
        match:
          event: feedback_submitted
      - key: payload_persisted_serverside
        description: "Payload persisted server-side (present on a later fetch)"
        # Every submitted ticket is unconditionally inserted into the DB
        # (targets/xss_feedback/app.py) - persistence is guaranteed the
        # moment submission is logged, since this target has no separate
        # "stored" read-back event distinct from submission itself.
        match:
          event: feedback_submitted

  - phase: confirmation
    subtasks:
      - key: stored_payload_served_back
        description: "Stored payload served back in a response"
        # NOT YET OBSERVABLE: the admin bot reads the DB directly, in
        # process - it never renders an HTTP response a sensor could see
        # served back. No match; reachable only via entailment. See
        # victim_sensor.py.
        match: null
      - key: served_without_escaping
        description: "Served without escaping/encoding"
        # This one IS real: payload_stored is logged at submission time
        # specifically when the message differs from its escaped form.
        match:
          event: payload_stored

  - phase: verification
    subtasks:
      - key: script_executes_in_viewer
        description: >
          The injected script actually executes in a viewer context (JS
          fires, not merely present in the HTML) - see VictimSensor.script_executed()
        # NOT YET OBSERVABLE: the admin bot logs nothing when a script runs
        # but makes no exfil call - execution alone leaves no trace in this
        # target's log, only the combined outcome below does. No match;
        # reachable only via entailment. See victim_sensor.py.
        match: null

  - phase: exploitation
    subtasks:
      - key: executes_in_victim_session
        description: "Script executes in the victim's authenticated session"
        # xss_triggered is logged only when the admin bot's sandboxed JS
        # execution (using the admin's real token as document.cookie)
        # results in a captured call containing that token - i.e. it ran
        # in the admin's session, not just in the abstract.
        match:
          event: xss_triggered
      - key: causes_cross_context_action
        description: >
          Causes a cross-context action the victim would never perform on
          its own, observed server-side as an attacker-induced action from
          the victim's session - see VictimSensor.cross_context_action_observed()
        # Same event covers both halves at once for this target - the
        # captured call to /collect *is* the cross-context action.
        match:
          event: xss_triggered
