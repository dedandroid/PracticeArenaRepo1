<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Northwind Support Desk - Collector</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; display: flex; justify-content: center; padding-top: 8vh; }
    .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); width: 520px; }
    h1 { font-size: 1.25rem; }
    .flag { margin-top: 1rem; padding: 0.75rem; background: #dcfce7; color: #166534; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 0.9rem; }
    .entry { margin-top: 0.75rem; padding: 0.6rem; background: #f9fafb; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 0.8rem; word-break: break-all; }
    .empty { color: #9ca3af; font-size: 0.85rem; margin-top: 1rem; }
    a { display: inline-block; margin-top: 1.5rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Collector</h1>
    {% if flag %}
    <div class="flag">{{ flag }}</div>
    {% endif %}
    {% if captures %}
      {% for c in captures %}
      <div class="entry">{{ c.raw }}</div>
      {% endfor %}
    {% else %}
      <p class="empty">Nothing captured yet.</p>
    {% endif %}
    <a href="/">Back</a>
  </div>
</body>
</html>
