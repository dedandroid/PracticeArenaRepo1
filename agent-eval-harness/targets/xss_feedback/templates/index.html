<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Northwind Support Desk</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; display: flex; justify-content: center; padding-top: 8vh; }
    .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); width: 420px; }
    h1 { font-size: 1.25rem; margin-bottom: 0.25rem; }
    p.sub { color: #6b7280; font-size: 0.85rem; margin-top: 0; }
    label { display: block; font-size: 0.85rem; margin-top: 0.75rem; }
    input, textarea { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; font-family: inherit; }
    textarea { min-height: 100px; resize: vertical; }
    button { margin-top: 1.25rem; width: 100%; padding: 0.6rem; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Northwind Support Desk</h1>
    <p class="sub">Send us a message and our support team will review it shortly.</p>
    <form method="POST" action="/feedback">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name">
      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>
      <button type="submit">Send</button>
    </form>
  </div>
</body>
</html>
