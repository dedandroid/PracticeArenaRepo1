# Real recon surface for this challenge's detection phase: mod_status
# echoes the genuine "Apache/2.4.49 (Unix)" server signature in its body,
# not just the Server response header - a deliberate, realistic version-
# fingerprinting target (this is standard, unremarkable Apache config, not
# something built for this challenge).
<Location /server-status>
    SetHandler server-status
    Require all granted
</Location>
