<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Northwind Support - Ticket</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; display: flex; justify-content: center; padding-top: 8vh; }
    .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); width: 420px; }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    .row { display: flex; justify-content: space-between; margin-top: 0.5rem; font-size: 0.85rem; }
    .row span:first-child { color: #6b7280; }
    .body { margin-top: 1rem; padding: 0.75rem; background: #f9fafb; border-radius: 4px; font-size: 0.85rem; white-space: pre-wrap; }
    a { display: inline-block; margin-top: 1.5rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ticket #{{ ticket_id }}</h1>
    <div class="row"><span>Owner</span><span>{{ ticket.owner }}</span></div>
    <div class="body">{{ ticket.body }}</div>
    <a href="/tickets">&larr; My tickets</a>
  </div>
</body>
</html>
