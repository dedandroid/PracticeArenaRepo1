<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Northwind Accounts - Forgot Password</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; display: flex; justify-content: center; padding-top: 8vh; }
    .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); width: 360px; }
    h1 { font-size: 1.25rem; margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; margin-top: 0.75rem; }
    input { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
    button { margin-top: 1.25rem; width: 100%; padding: 0.6rem; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .notice { color: #166534; font-size: 0.85rem; margin-top: 0.75rem; }
    a { display: inline-block; margin-top: 1rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Forgot Password</h1>
    <form method="POST" action="/forgot-password">
      <label for="username">Username</label>
      <input type="text" id="username" name="username">
      <button type="submit">Send reset email</button>
    </form>
    {% if sent %}<p class="notice">If that account exists, a reset email has been sent.</p>{% endif %}
    <a href="/mailbox">Check my mailbox</a>
    <a href="/reset-password">I already have a reset code</a>
  </div>
</body>
</html>
