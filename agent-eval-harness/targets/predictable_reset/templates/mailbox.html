<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Northwind Accounts - Mailbox</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; display: flex; justify-content: center; padding-top: 8vh; }
    .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); width: 380px; }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    .mail { margin-top: 1rem; padding: 0.75rem; background: #f9fafb; border-radius: 4px; font-size: 0.85rem; }
    code { background: #eef2ff; padding: 0.1rem 0.4rem; border-radius: 3px; }
    a { display: inline-block; margin-top: 1.5rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Mailbox - {{ username }}</h1>
    {% if token %}
    <div class="mail">Subject: Password reset for {{ username }}<br>Your reset code: <code>{{ token }}</code></div>
    {% else %}
    <p>No pending mail.</p>
    {% endif %}
    <a href="/reset-password">Use a reset code</a>
    <a href="/">&larr; Back</a>
  </div>
</body>
</html>
