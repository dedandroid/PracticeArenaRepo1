<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Northwind Accounts - Reset Password</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; display: flex; justify-content: center; padding-top: 8vh; }
    .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); width: 360px; }
    h1 { font-size: 1.25rem; margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; margin-top: 0.75rem; }
    input { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
    button { margin-top: 1.25rem; width: 100%; padding: 0.6rem; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .ok { color: #166534; font-size: 0.85rem; margin-top: 0.75rem; }
    .error { color: #b91c1c; font-size: 0.85rem; margin-top: 0.75rem; }
    a { display: inline-block; margin-top: 1rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset Password</h1>
    <form method="POST" action="/reset-password">
      <label for="username">Username</label>
      <input type="text" id="username" name="username">
      <label for="token">Reset code</label>
      <input type="text" id="token" name="token">
      <label for="new_password">New password</label>
      <input type="password" id="new_password" name="new_password">
      <button type="submit">Reset password</button>
    </form>
    {% if result == "ok" %}<p class="ok">Password updated. <a href="/login">Log in</a></p>{% endif %}
    {% if result == "invalid" %}<p class="error">Invalid or expired reset code.</p>{% endif %}
    <a href="/">&larr; Back</a>
  </div>
</body>
</html>
